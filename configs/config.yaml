data:
  data_dir: "MachineLearningCVE"
  sample_frac: 1.0          # 0.1 → quick test, 1.0 → full dataset
  label_col: "Label"

preprocessing:
  variance_threshold: 0.01  # drop near-zero-variance features
  scale: true               # StandardScaler
  use_smote: true           # handle class imbalance

model:
  name: "xgboost"           # logistic_regression | random_forest | xgboost | lightgbm
  final: "xgboost_feat_eng" # final model saved at outputs/models/xgboost_feat_eng.joblib
  params:
    logistic_regression:
      max_iter: 1000
      C: 1.0
      n_jobs: -1
    random_forest:
      n_estimators: 100
      max_depth: null
      n_jobs: -1
    xgboost:                 # Phase 4 final params (F1 Macro=0.8605)
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      n_jobs: -1
    lightgbm:
      n_estimators: 200
      learning_rate: 0.1
      num_leaves: 63
      verbose: -1
      n_jobs: -1

cv:
  n_splits: 5
  scoring:
    - f1_macro
    - accuracy
  random_state: 42

output:
  models_dir: "outputs/models"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
  save_model: true

task: "multiclass"    # binary | multiclass
test_size: 0.2
random_state: 42
